<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Design Patterns Quiz</title>
    <meta name="description" content="Você conhece design patterns? Responda o quiz, veja as explicações e descubra.">
    <meta name="color-scheme" content="light dark">
    <script>
        // Tema escolhido no blog (localStorage.preferredTheme), aplicado antes do primeiro paint
        try {
            var theme = localStorage.getItem('preferredTheme');
            if (theme === 'auto' || theme === 'light' || theme === 'dark') {
                document.documentElement.setAttribute('data-theme', theme);
            }
        } catch (e) {}
    </script>
    <meta name="theme-color" content="#f6f6f6" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#151a18" media="(prefers-color-scheme: dark)">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Roboto:wght@300;400;500&display=swap">
    <link rel="stylesheet" href="style.css">

    <!-- Google Analytics (GA4): mesma propriedade da página principal e do blog -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-X9L3PKSVL0"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-X9L3PKSVL0');
    </script>
</head>

        <a class="back-link" href="https://enoque.dev/"><span aria-hidden="true">←</span> <span data-i18n="backToSite">enoque.dev</span></a>

</body>

</html>
